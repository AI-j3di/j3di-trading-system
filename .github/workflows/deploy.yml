name: J3DI Deploy
on:
  push:
    branches: [main]

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          echo "VM_IP is set: ${{ secrets.VM_IP != '' }}"
          echo "VM_USER is set: ${{ secrets.VM_USER != '' }}"
          echo "VM_PASSWORD is set: ${{ secrets.VM_PASSWORD != '' }}"

      - name: Deploy to demo path on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd C:\wvs\demo
            git pull origin main

  deploy-live:
    runs-on: ubuntu-latest
    environment: live          # requires manual approval
    needs: deploy-demo
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to live path on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd C:\wvs\live
            git pull origin main
